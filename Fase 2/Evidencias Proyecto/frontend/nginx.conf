# Feature 024: zonas del borde. El archivo se copia a
# /etc/nginx/conf.d/default.conf, asi que estas directivas viven en `http`.
limit_req_zone $binary_remote_addr zone=api_peticiones:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=api_conexiones:10m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
    gzip_comp_level 2;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Feature 024: limite de tasa y de conexiones con respuesta JSON.
    limit_req_status 429;
    limit_conn_status 429;
    error_page 429 = @limite_api;

    # Handle Angular routing - redirect all routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Feature 028: el canal SSE (/api/v1/eventos/) necesita que nginx no
    # almacene en bufer, un timeout mayor que el latido (25 s) y la misma IP
    # de cliente que la 025 usa con LIMITE_TASA_CONFIAR_PROXY=true. La
    # coincidencia exacta es mas especifica que /api/ y conserva los limites
    # de la 024; el resto de la API no cambia.
    location = /api/v1/eventos/ {
        limit_req zone=api_peticiones burst=20 nodelay;
        limit_conn api_conexiones 20;

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API proxy to backend
    location /api/ {
        limit_req zone=api_peticiones burst=20 nodelay;
        limit_conn api_conexiones 20;

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Feature 024: el endpoint Prometheus es interno y no se publica.
    location = /metrics {
        return 404;
    }

    location = /metrics/ {
        return 404;
    }

    # Feature 024: unico lugar donde se refleja el Origin, y solo para el 429.
    location @limite_api {
        default_type application/json;
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Vary Origin always;
        return 429 '{"detail":"Demasiadas peticiones. Intente nuevamente en unos segundos."}';
    }
}
